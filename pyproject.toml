[project]
name = "iou"
version = "0.1.0"
description = "Debt tracking for small teams: expenses, splits and settlements over a single SQLite database."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
iou = "iou.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iou"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
